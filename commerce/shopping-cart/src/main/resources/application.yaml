spring:
  application:
    name: shopping-cart

  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        serviceId: config-server

eureka:
  client:
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname:localhost}:${eureka.instance.port:8761}/eureka/


resilience4j:
  circuitbreaker:
    instances:
      warehouse:
        slidingWindowSize: 5
        failureRateThreshold: 40
        waitDurationInOpenState: 15000
        permittedNumberOfCallsInHalfOpenState: 2